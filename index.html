<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Mini Calculator</title>
</head>
<body>
<div class="div2">
    <h2>Mini Calculator of only two numbers</h2>
    <hr>
    <input type="text" id="n1" placeholder="Enter first no."><br>
    <input type="text" id="n2" placeholder="Enter second no."><br>
    
    <button type="button" id="add" onclick="add()">Addition</button>
    <button  type="button" id="sub" onclick="sub()">Substraction</button><br>
    <button type="button" id="mul" onclick="mul()">Multiplcation</button>
    <button type="button" id="sqad" onclick="sqadd()">Square addition</button><br>
    <button type="button" id="cbad" onclick="cb_add()">Cube addition</button>
    <button type="button" id="di" onclick="div()">Division</button> <br>
    <button type="button" id="clr" onclick="clr()" class="clr">Clear all</button><br><br>
    <p id="data1"></p>
    <p id="data2"></p>
    </div>
         <script src="script.js"></script>
</body>
</html>
